name: Synchroniser le canal officiel VYRO

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-vyro.yml"
      - "sync-vyro.mjs"
      - "trusted-signer.sha256"

permissions:
  contents: write

concurrency:
  group: vyro-official-manifest
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Vérifier l’APK et préparer le manifeste
        run: node sync-vyro.mjs
      - name: Diffuser le manifeste vérifié
        run: |
          set -euo pipefail
          if git diff --quiet -- latest.json; then
            echo "Aucune version à diffuser."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- latest.json
          git commit -m "Publier une mise à jour officielle VYRO vérifiée"
          git push origin HEAD:main
